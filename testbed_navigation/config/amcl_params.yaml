# AMCL (Adaptive Monte Carlo Localization) parameters for Testbed-T1.0.0
# Values start from the Nav2 defaults, adjusted for this robot's
# frames, lidar, spawn pose, and a slow (VM) simulation.
amcl:
  ros__parameters:
    use_sim_time: true

    # ---------- Frames & topics (must match the robot) ----------
    global_frame_id: "map"            # frame published by map_server
    odom_frame_id: "odom"             # published by the Gazebo diff-drive plugin
    base_frame_id: "base_footprint"   # robot_base_frame in testbed.gazebo
    scan_topic: "scan"                # lidar plugin remaps ~/out -> scan
    map_topic: "map"

    # ---------- Motion model ----------
    # Testbed is a differential-drive robot (two wheels + casters)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # ---------- Particle filter ----------
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.25                # update after moving 25 cm...
    update_min_a: 0.2                 # ...or turning ~11 degrees

    # ---------- Laser model ----------
    laser_model_type: "likelihood_field"
    laser_min_range: 0.10             # matches <min> in testbed.gazebo
    laser_max_range: 12.0             # matches <max> after the lidar fix
    max_beams: 60                     # use 60 of the 300 rays per update
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    do_beamskip: false

    # ---------- TF ----------
    tf_broadcast: true                # publish map -> odom
    transform_tolerance: 1.0          # generous: sim runs below real time in the VM
    save_pose_rate: 0.5

    # ---------- Initial pose ----------
    # Robot spawns at (0, 5, yaw 0) in Gazebo (spawn_testbed.launch.py);
    # map origin verified to align with the Gazebo world frame.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    first_map_only: false
